```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Study Hub | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101b3d, #4338ca, #7c3aed);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4338ca, #7c3aed);
            color: white;
            font-size: 25px;
            font-weight: bold;
            border-radius: 50%;
        }

        h1 {
            text-align: center;
            color: #252b50;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #5b4bdb;
            box-shadow: 0 0 0 3px rgba(91, 75, 219, 0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #5145cd;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 22px;

        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;

        }

        .remember input {
            width: auto;
        }

        .options a {
            color: #5145cd;

        .login-btn {

                padding: 25px 20px;
            }

                font-size: 24px;

        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">AR</div>

        <h1>AR Study Hub</h1>
        <p class="subtitle">Your Learning Journey Starts Here</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Email or Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >SHOW</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login to Study Hub
            </button>

            <p class="message" id="message" role="status"></p>

        </form>

        <div class="admin-note">
            🔐 Access is for authorized users only.
        </div>

        <div class="footer">
            © 2026 AR Study Hub<br>
            Learn • Practice • Succeed
        </div>

    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        // Show or hide password
        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "HIDE" : "SHOW";
        });

        // Login form
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            message.style.color = "#c0392b";
            message.textContent =
                "Login is not connected to an authentication server yet.";
        });

        // Forgot password
        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();

                message.style.color = "#5145cd";
                message.textContent =
                    "Please contact the AR Study Hub administrator to reset your password.";
            });
    </script>

</body>
</html>
